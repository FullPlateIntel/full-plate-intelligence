# Full Plate Intelligence – Netlify project configuration (RC2).
# Deliberate change from the earlier single-file deployment: the publish directory is now `dist/` (built by
# `make build`), not the repository root. The repository root (build scripts, tests, mock Kit, docs) is never published.

[build]
  command = "python3 build/extract.py && python3 build/build.py && python3 build/apply_brand_favicon_html.py && python3 build/apply_steve_meta.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/subscribe is routed by `config.path` in netlify/functions/subscribe.mjs.
# Headers and redirects are emitted by the build into dist/_headers and dist/_redirects (Netlify reads them from the publish dir).
